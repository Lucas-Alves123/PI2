name: CI/CD — Rota Vital

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes (unitários + integração + BDD)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar todos os testes
        run: ./mvnw verify -B
        # mvn verify: unitários (surefire) + integração/BDD (failsafe + Testcontainers)

  imagem:
    name: Publicar imagem Docker
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rotavital:latest

  deploy:
    name: Deploy no Render
    needs: imagem
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Disparar deploy hook do Render
        run: |
          curl -sSf "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" > /dev/null

      - name: Smoke test (health check)
        run: |
          sleep 30
          curl -sSf "${{ secrets.RENDER_APP_URL }}/actuator/health" | grep '"status":"UP"'

