name: CI/CD — Rota Vital

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Testes (unitários + ArchUnit + BDD Cucumber)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes unitários, arquitetura e BDD (Cucumber)
        run: ./mvnw verify -B

  imagem:
    name: Publicar imagem Docker
    needs: testes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rotavital:latest

  deploy:
    name: Deploy e Smoke Test
    needs: imagem
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Disparar deploy hook do Render (quando configurado)
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -sSf "$HOOK_URL" > /dev/null
            echo "Deploy disparado no Render com sucesso."
          else
            echo "RENDER_DEPLOY_HOOK_URL nao configurado; executando validacao de container na esteira."
          fi

      - name: Smoke test da versao publicada (/actuator/health)
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL || vars.APP_URL }}
        run: |
          if [ -n "$APP_URL" ]; then
            for i in $(seq 1 12); do
              if curl -sSf "$APP_URL/actuator/health" | grep -q '"status":"UP"'; then
                echo "Smoke test em producao ($APP_URL) passou!"
                exit 0
              fi
              sleep 10
            done
            exit 1
          else
            docker compose up -d --build
            for i in $(seq 1 18); do
              if curl -sSf "http://localhost:8080/actuator/health" | grep -q '"status":"UP"'; then
                echo "Smoke test do container (/actuator/health -> UP) passou!"
                docker compose down -v
                exit 0
              fi
              sleep 5
            done
            docker compose logs
            docker compose down -v
            exit 1
          fi
