<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Rota Vital — Solicitações</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <span class="logo-icon">🩸</span>
    <span>Rota Vital</span>
  </div>
  <nav>
    <a href="/">📊 Dashboard</a>
    <a href="/hospitais">🏥 Hospitais</a>
    <a href="/estoque">📦 Estoque</a>
    <a href="/requisicoes" class="active">📝 Solicitações</a>
    <a href="/expedicao">🚚 Expedição</a>
    <a href="/telemetria">🌡️ Telemetria</a>
  </nav>
</aside>

<main class="content">
  <header class="topbar">
    <h1>Solicitações Hospitalares e Alocação Inteligente</h1>
  </header>

  <h2 style="font-size: 1.1rem; margin-bottom: 10px;">Registrar Nova Solicitação Hospitalar</h2>
  <form class="compact-form" action="/requisicoes/criar" method="post">
    <div class="form-group">
      <label>Hospital Solicitante</label>
      <select name="hospitalId">
        <option th:each="h : ${hospitais}" th:value="${h.id}" th:text="${h.nome}"></option>
      </select>
    </div>
    <div class="form-group">
      <label>ABO Solicitado</label>
      <select name="abo">
        <option th:each="a : ${tiposAbo}" th:value="${a}" th:text="${a}"></option>
      </select>
    </div>
    <div class="form-group">
      <label>Rh Solicitado</label>
      <select name="rh">
        <option th:each="r : ${tiposRh}" th:value="${r}" th:text="${r}"></option>
      </select>
    </div>
    <div class="form-group">
      <label>Componente</label>
      <select name="componente">
        <option th:each="c : ${componentes}" th:value="${c}" th:text="${c}"></option>
      </select>
    </div>
    <div class="form-group">
      <label>Qtd Bolsas</label>
      <input type="number" name="quantidade" min="1" max="20" value="1" required>
    </div>
    <div class="form-group">
      <label>Urgência</label>
      <select name="urgencia">
        <option th:each="u : ${urgencias}" th:value="${u}" th:text="${u}"></option>
      </select>
    </div>
    <div class="form-group">
      <label>Observação Clínica</label>
      <input type="text" name="observacao" placeholder="Ex: Paciente leito 4 UTI">
    </div>
    <button type="submit" class="btn-primary">Registrar & Alocar FEFO</button>
  </form>

  <h2 style="margin-top: 25px; font-size: 1.1rem;">Lista de Requisições Hospitalares</h2>
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Hospital ID</th>
        <th>Tipo Solicitado</th>
        <th>Componente</th>
        <th>Quantidade</th>
        <th>Alocadas</th>
        <th>Urgência</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${requisicoes}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.hospitalId}"></td>
        <td><strong th:text="${r.aboSolicitado + (r.rhSolicitado.name() == 'POSITIVO' ? '+' : '-')}"></strong></td>
        <td th:text="${r.componente}"></td>
        <td th:text="${r.quantidade}"></td>
        <td th:text="${#lists.size(r.alocacoes)}"></td>
        <td th:text="${r.urgencia}"></td>
        <td><span th:class="'badge badge-' + ${#strings.toLowerCase(r.status)}" th:text="${r.status}"></span></td>
        <td>
          <form th:if="${r.status.name() == 'PENDENTE' or r.status.name() == 'PARCIALMENTE_ATENDIDA'}"
                th:action="'/requisicoes/' + ${r.id} + '/alocar'" method="post" style="display:inline;">
            <button type="submit" class="btn-primary btn-sm">Tentar FEFO</button>
          </form>
          <form th:if="${r.status.name() != 'CONCLUIDA' and r.status.name() != 'CANCELADA' and r.status.name() != 'EM_EXPEDICAO'}"
                th:action="'/requisicoes/' + ${r.id} + '/cancelar'" method="post" style="display:inline; margin-left: 4px;">
            <button type="submit" class="btn-primary btn-sm" style="background:#dc2626;">Cancelar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

</main>

</body>
</html>
