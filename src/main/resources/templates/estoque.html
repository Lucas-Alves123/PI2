<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Rota Vital — Estoque de Bolsas</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <span class="logo-icon">🩸</span>
    <span>Rota Vital</span>
  </div>
  <nav>
    <a href="/">📊 Dashboard</a>
    <a href="/hospitais">🏥 Hospitais</a>
    <a href="/estoque" class="active">📦 Estoque</a>
    <a href="/requisicoes">📝 Solicitações</a>
    <a href="/expedicao">🚚 Expedição</a>
    <a href="/telemetria">🌡️ Telemetria</a>
  </nav>
</aside>

<main class="content">
  <header class="topbar">
    <h1>Controle de Estoque e Validades (FEFO)</h1>
  </header>

  <h2 style="font-size: 1.1rem; margin-bottom: 10px;">Cadastrar Nova Bolsa Sintética</h2>
  <form class="compact-form" action="/estoque/cadastrar" method="post">
    <div class="form-group">
      <label>Código da Bolsa</label>
      <input type="text" name="codigo" placeholder="RV-2026-999" required>
    </div>
    <div class="form-group">
      <label>ABO</label>
      <select name="abo">
        <option th:each="a : ${tiposAbo}" th:value="${a}" th:text="${a}"></option>
      </select>
    </div>
    <div class="form-group">
      <label>Rh</label>
      <select name="rh">
        <option th:each="r : ${tiposRh}" th:value="${r}" th:text="${r}"></option>
      </select>
    </div>
    <div class="form-group">
      <label>Componente</label>
      <select name="componente">
        <option th:each="c : ${componentes}" th:value="${c}" th:text="${c}"></option>
      </select>
    </div>
    <div class="form-group">
      <label>Data Coleta</label>
      <input type="date" name="dataColeta" required>
    </div>
    <div class="form-group">
      <label>Data Validade</label>
      <input type="date" name="dataValidade" required>
    </div>
    <div class="form-group">
      <label>Localização</label>
      <input type="text" name="localizacao" placeholder="Ex: Prateleira B2">
    </div>
    <button type="submit" class="btn-primary">Adicionar ao Estoque</button>
  </form>

  <h2 style="margin-top: 25px; font-size: 1.1rem;">Bolsas Armazenadas</h2>
  <table class="data-table">
    <thead>
      <tr>
        <th>Código</th>
        <th>Tipo ABO/Rh</th>
        <th>Componente</th>
        <th>Coleta</th>
        <th>Validade</th>
        <th>Localização</th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="b : ${bolsas}">
        <td th:text="${b.codigo}"></td>
        <td><strong th:text="${b.abo + (b.rh.name() == 'POSITIVO' ? '+' : '-')}"></strong></td>
        <td th:text="${b.componente}"></td>
        <td th:text="${b.dataColeta}"></td>
        <td th:text="${b.dataValidade}"></td>
        <td th:text="${b.localizacao}"></td>
        <td><span th:class="'badge badge-' + ${#strings.toLowerCase(b.status)}" th:text="${b.status}"></span></td>
        <td>
          <form th:if="${b.status.name() == 'DISPONIVEL'}" action="/estoque/descartar" method="post" style="display:inline;">
            <input type="hidden" name="bolsaId" th:value="${b.id}">
            <button type="submit" class="btn-primary btn-sm" style="background:#dc2626;">Descartar</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

</main>

</body>
</html>
