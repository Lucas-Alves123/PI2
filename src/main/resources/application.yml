spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rotavital}
    username: ${DB_USER:rotavital}
    password: ${DB_PASSWORD:rotavital}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin123}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

rotavital:
  estoque:
    dias-alerta-vencimento: 7
  temperatura:
    limite-minimo: ${TEMP_MIN:2.0}
    limite-maximo: ${TEMP_MAX:6.0}

