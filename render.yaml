databases:
  - name: rotavital-db
    databaseName: rotavital
    user: rotavital
    plan: free

services:
  - type: web
    name: rotavital
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: rotavital-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rotavital-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: rotavital-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: rotavital-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rotavital-db
          property: password
      - key: ADMIN_PASSWORD
        value: admin123
